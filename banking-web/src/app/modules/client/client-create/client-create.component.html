<form class="form"
  #resultForm="ngForm"
  (ngSubmit)="clickForm()"
  autocomplete="off">
    
    <div class="form-grid">
        
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" [(ngModel)]="client.person.personName" required>
        </div>
    
        <div class="form-group">
            <label for="genero">Género</label>
            <input type="text" id="genero" name="genero" [(ngModel)]="client.person.personGender" required>
        </div>
    
        <div class="form-group">
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad" [(ngModel)]="client.person.personAge" required>
        </div>
    
        <div class="form-group">
            <label for="identificacion">Nro. Identificación</label>
            <input type="text" id="identificacion" name="identificacion" [(ngModel)]="client.person.personIdentification" required>
        </div>
    
        <div class="form-group">
            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" name="direccion" [(ngModel)]="client.person.personAddress" required>
        </div>
    
        <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono" name="telefono" [(ngModel)]="client.person.personPhone" required>
        </div>
        
        <div class="form-group">
            <label for="contrasena">Contraseña</label>
            <input type="passwords" id="contrasena" name="contrasena" [(ngModel)]="client.clientPassword" required>
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn-yellow">Guardar</button>
        <button type="button" class="btn-cancel" (click)="cancelForm()">Cancelar</button>
    </div>
</form>
