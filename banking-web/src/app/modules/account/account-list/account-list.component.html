<h2>Cuentas</h2>
<div>
    <button *ngIf="!showCreateAccount"
        class="btn-yellow"
        (click)="showCreateAccountModal()">Nuevo</button>
</div>

<br>

<div *ngIf="showCreateAccount">
    <app-account-create
        (formCancelled)="hideCreateAccountModal()"
        (reloadList)="reloadList()"
    >
    </app-account-create>
</div>

<div class="table" *ngIf="!showCreateAccount">
    <table>
        <thead>
            <tr>
                <th>Número de cuenta</th>
                <th>Tipo de cuenta</th>
                <th>Saldo inicial</th>
                <th>Estado</th>
                <th>Cliente</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let account of accountList">
                <td>{{ account.accountNumber }}</td>
                <td>{{ account.accountType }}</td>
                <td>{{ account.accountBeginBalance }}</td>
                <td>{{ account.accountStatus }}</td>
                <td>{{ account.client.person.personName }}</td>
            </tr>
        </tbody>
    </table>
</div>
